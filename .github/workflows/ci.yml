name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend linting with Ruff
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev
      - name: Ruff lint check
        run: uv run ruff check .
        continue-on-error: true  # Pre-existing warnings in broker modules
      - name: Ruff format check
        run: uv run ruff format --check .
        continue-on-error: true  # Pre-existing formatting in broker modules

  # Backend tests (CI-safe subset - no broker credentials needed)
  # Matrixed across every Python the project supports (pyproject requires-python >=3.12).
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Domain declarations match canonical schemas
        run: uv run python contracts/generate_types.py --check
      - name: Run CI-safe tests
        run: |
          uv run pytest test/test_log_location.py test/test_navigation_update.py \
            test/test_domain_contracts.py test/test_domain_legacy.py \
            test/test_domain_repository.py test/test_domain_backup.py \
            test/test_local_account_access.py test/test_user_identity_migration.py \
            test/test_local_data_api.py test/test_workspace_storage.py \
            test/test_workspace_recovery.py test/test_workspace_worker.py \
            test/test_journal_import.py test/test_journal_service.py \
            test/test_journal_api.py test/test_journal_recovery.py \
            test/test_journal_metrics_review.py test/test_journal_review_findings.py \
            test/test_journal_final_review.py \
            test/test_journal_resource_audit.py \
            test/test_dataset_quality.py test/test_data_library.py \
            test/test_data_library_api.py test/test_data_library_review.py \
            test/test_data_library_resources.py test/test_data_library_restore_links.py \
            test/test_dataset_downloads.py test/test_dataset_provider.py \
            test/test_chart_context.py test/test_chart_evidence.py \
            test/test_chart_evidence_api.py test/test_chart_evidence_review.py \
            test/test_chart_workflow_resources.py \
            test/test_paper_engine.py test/test_paper_engine_review.py \
            test/test_paper_sessions.py test/test_paper_sessions_review.py \
            test/test_paper_market.py test/test_paper_api.py \
            test/test_paper_broker_boundary.py test/test_paper_resources.py \
            test/test_paper_storage.py test/test_paper_journal.py \
            test/test_paper_journal_context.py \
            test/test_paper_reports.py \
            test/test_connectors.py test/test_connector_vault.py \
            test/test_connector_api.py test/test_connector_resources.py \
            test/test_connector_adapters.py test/test_connector_mt5.py \
            test/test_connector_conformance.py test/test_connector_history.py \
            test/test_connector_storage.py test/test_connector_recovery.py \
            test/test_connector_service_review.py \
            test/test_connector_sync_plan.py \
            test/test_connector_adapter_review.py \
            test/test_mt5_execution.py test/test_mt5_account_snapshot.py \
            test/test_market_feeds.py test/test_market_quotes.py test/test_retired_features.py \
            test/test_personal_workspace.py test/test_personal_workspace_review.py \
            test/test_kraken_market.py test/test_kraken_market_api.py \
            test/test_history_service_source_validation.py \
            test/test_historify_custom_timeframes.py \
            test/test_gthread_historify_writes.py \
            test/test_gthread_hosts_historify_jobs.py \
            test/test_python_editor.py test/test_rate_limits_simple.py \
            test/test_logout_csrf.py test/test_auth_logout.py \
            test/test_auth_resume.py test/test_auth_upsert_multisession.py \
            test/sandbox/test_execution_backlog.py test/test_event_bus_bounded.py \
            test/test_cors_config.py \
            test/test_market_calendar_validation.py \
            test/test_admin_client_error_url.py \
            test/test_core_credential_logging.py \
            test/test_multi_option_greeks_regression.py \
            test/test_history_format.py \
            test/test_precompress_assets.py \
            test/test_broker_credential_logging.py \
            test/test_option_symbol_service_validation.py \
            test/test_graceful_shutdown.py \
            test/test_flattrade_issue_1965.py \
            test/test_requirements_parity.py \
            test/test_qty_freeze_unknown_default.py \
            test/test_migrate_qty_freeze_oct_2026.py \
            test/test_connector_kraken.py test/test_kraken_instruments.py \
            test/test_kraken_streams.py test/test_kraken_journal.py \
            test/test_connector_alpaca.py test/test_platform_bridge.py \
            test/test_execution.py test/test_copy_groups.py \
            test/test_deployments.py test/test_deployments_api.py \
            test/test_research_domain.py test/test_research_providers.py \
            test/test_edgar_adapter.py test/test_research_api.py \
            test/test_research_quality.py test/test_research_terminal.py \
            test/test_fundamentals.py test/test_macro.py \
            test/test_history_sync.py test/test_crypto_exchanges.py \
            test/test_connector_topstepx.py \
            -v --timeout=60

  # The web server launcher, booted for real. install/chartly-gunicorn.sh is
  # what an opted-in Ubuntu service and the gthread Docker start run, and it
  # also runs eventlet (still the default web server) the same way. Each cell
  # starts the app through it with a throwaway .env and runs
  # scripts/gthread_smoke.py: the page, Socket.IO over polling and websocket,
  # an SSE stream, requests while streams are held open, the runtime report,
  # where the market data proxy runs, and a SIGTERM stop with connections
  # open. gunicorn and eventlet are not in pyproject, so they are installed
  # with the same pins as requirements-nginx.txt and the Dockerfile.
  gunicorn-boot:
    needs: backend-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            worker: eventlet
            mode: systemd
            proxy: child
            stop-within: 45
          - python-version: "3.12"
            worker: gthread
            mode: systemd
            proxy: child
            stop-within: 45
          - python-version: "3.12"
            worker: gthread
            mode: docker
            proxy: external
            # Docker's default stop window.
            stop-within: 10
          - python-version: "3.14"
            worker: gthread
            mode: systemd
            proxy: child
            stop-within: 45
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Install the production web server
        # A server has eventlet installed whichever web server it runs, so the
        # gthread cells keep it too. eventlet is not yet known to install on
        # every newer Python, so the newest cell runs gthread without it.
        run: |
          uv pip install "gunicorn>=25.0,<26"
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            uv pip install "eventlet==0.41.2"
          fi
      - name: Throwaway .env
        run: |
          cp .sample.env .env
          APP_KEY=$(.venv/bin/python -c 'import secrets; print(secrets.token_hex(32))')
          PEPPER=$(.venv/bin/python -c 'import secrets; print(secrets.token_hex(32))')
          sed -i "s|^APP_KEY *=.*|APP_KEY = '$APP_KEY'|; s|^API_KEY_PEPPER *=.*|API_KEY_PEPPER = '$PEPPER'|" .env
          sed -i "s|^FLASK_PORT *=.*|FLASK_PORT = '5099'|; s|^WEBSOCKET_PORT *=.*|WEBSOCKET_PORT = '8799'|; s|^ZMQ_PORT *=.*|ZMQ_PORT = '5599'|" .env
          sed -i "s|^HOST_SERVER *=.*|HOST_SERVER = 'http://127.0.0.1:5099'|; s|^REDIRECT_URL *=.*|REDIRECT_URL = 'http://127.0.0.1:5099/zerodha/callback'|" .env
          echo "CHARTLY_WORKER_CLASS = '${{ matrix.worker }}'" >> .env
          mkdir -p db log
      - name: Boot through the launcher and run the smoke
        run: |
          if [ "${{ matrix.mode }}" = "docker" ]; then
            # What start.sh does in the image: the proxy on its own, then the
            # launcher with Docker's options.
            export APP_MODE=standalone
            .venv/bin/python -m websocket_proxy.server > proxy.log 2>&1 &
            bash install/chartly-gunicorn.sh --venv .venv --bind 127.0.0.1:5099 \
              --proxy-mode external --timeout 300 --graceful-timeout 30 \
              --worker-tmp-dir /tmp --log-level info > gunicorn.log 2>&1 &
          else
            bash install/chartly-gunicorn.sh --venv .venv --bind 127.0.0.1:5099 \
              --proxy-mode subprocess --log-level info > gunicorn.log 2>&1 &
          fi
          .venv/bin/python scripts/gthread_smoke.py --base-url http://127.0.0.1:5099 \
            --worker ${{ matrix.worker }} --env-file .env --proxy-port 8799 \
            --proxy ${{ matrix.proxy }} --pid $! --stop-within ${{ matrix.stop-within }} \
            --log gunicorn.log
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: gunicorn-boot-${{ matrix.worker }}-${{ matrix.mode }}-py${{ matrix.python-version }}
          path: |
            gunicorn.log
            proxy.log
            log/errors.jsonl
          retention-days: 7

  # The eventlet tests. They run eventlet in a subprocess and assert on elapsed
  # time and hub liveness, and each skips itself when eventlet is missing, which
  # pyproject does not install. Here eventlet is installed, and the last step
  # fails if anything was skipped, so a broken install cannot pass as skips.
  eventlet-fallback:
    needs: backend-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - run: uv pip install "gunicorn>=25.0,<26" "eventlet==0.41.2"
      - run: .venv/bin/python -c "import eventlet, gunicorn"
      - name: Run the eventlet tests
        run: |
          .venv/bin/python -m pytest \
            test/test_eventlet_cross_thread_locks.py \
            test/test_sqlite_lock_cooperative.py \
            test/test_agent_stream_eventlet.py \
            test/test_gthread_deploy_eventlet.py \
            -o addopts="" --timeout=120 -rs --junitxml=eventlet.xml
      - name: Every eventlet test ran
        run: |
          .venv/bin/python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("eventlet.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"{tests} eventlet tests, {skipped} skipped")
          sys.exit(1 if tests == 0 or skipped else 0)
          EOF

  # Static gates for code request threads run under gthread. The gates key
  # their reviewed lists by file and function; see the scripts for each rule.
  gthread-gates:
    needs: backend-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - run: uv pip install "gunicorn>=25.0,<26" "eventlet==0.41.2"
      - name: Check-then-act gate
        run: .venv/bin/python scripts/gthread_check_then_act.py
      - name: Sleep gate
        run: .venv/bin/python scripts/gthread_sleep_gate.py

  # The complete gthread migration suite: deploy, foundation, broker, host,
  # messaging, sandbox, strategy and review tests. Previously only deploy and
  # foundation files ran in CI; the other migration tests could silently rot.
  # These tests use fake brokers and isolated test databases, not live accounts.
  # Eventlet is installed here too so the lifecycle and compatibility proofs
  # execute rather than skip on the default production worker.
  gthread-migration:
    needs: backend-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - run: uv pip install "gunicorn>=25.0,<26" "eventlet==0.41.2"
      - name: Run every gthread migration test file
        run: .venv/bin/python -m pytest test/test_gthread_*.py -o addopts="" --timeout=120 -rs

  # Windows (development installs), macOS and native Linux ARM64 run the
  # portable runtime, lifecycle, session, shutdown and sandbox money tests.
  # Shell launcher/systemd/Docker tests stay in the Linux migration job.
  # The ARM64 cell installs eventlet so the default-worker lifecycle cases run.
  gthread-platforms:
    needs: backend-lint
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - name: Install the default worker on Linux ARM64
        if: runner.os == 'Linux'
        run: uv pip install "eventlet==0.41.2"
      - name: Portable runtime and concurrency tests
        run: >-
          uv run --no-sync python -m pytest
          test/test_gthread_foundation_runtime.py
          test/test_gthread_foundation_lifecycle.py
          test/test_gthread_core_db_sessions.py
          test/test_gthread_core_shutdown.py
          test/test_gthread_core_proxy_mode.py
          test/test_gthread_hosts_chartink.py
          test/test_gthread_historify_lifecycle.py
          test/test_gthread_sandbox_funds.py
          test/test_gthread_sandbox_orders.py
          test/test_gthread_review_funds_cas_cleanup.py
          test/test_gthread_memory_auth_decrypt.py
          test/test_gthread_memory_order_updates.py
          test/test_gthread_hosts_python_sse.py
          test/test_gthread_messaging_agent.py
          test/test_gthread_memory_flow.py
          -o addopts="" --timeout=120 -rs

  # Frontend linting
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  # The chart-indicator skill documents the chartly-charts build that /trading
  # actually pins, so a version bump that leaves the skill behind fails here.
  # Both checks existed and nothing ran them: the export index sat on 1.8.1 while
  # the app shipped 2.1.5, so 26 exports were missing from the reference and the
  # count it advertised was wrong by 26.
  chart-indicator-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: export index matches the pinned chartly-charts
        run: node .claude/skills/chart-indicator/generate-api-index.mjs --check
      - name: every export and capability is documented and demonstrated
        run: node .claude/skills/chart-indicator/coverage.mjs
      - name: drawing menu metadata matches the pinned package
        run: node frontend/scripts/generate-drawing-tools.mjs --check
      - name: toolbar and rail glyphs match the pinned package
        run: node frontend/scripts/generate-chrome-icons.mjs --check

  # The openscript skill documents the chartly-script compiler that /trading
  # actually pins, and the same reasoning applies: a version bump that leaves the
  # skill behind leaves an author reading a page about a compiler that is no
  # longer installed.
  #
  # The third check is the one specific to this skill. Its pitfalls page teaches
  # by naming diagnostic codes, and an author trusts a code. Two of the claims on
  # the first draft were wrong: a stateful call in a branch is a warning rather
  # than a refusal, so "the compiler will catch it" was false, and the fix the
  # page offered for a conditional fill used a colour that does not exist. Both
  # were found by compiling the page's own snippets, which is what runs here.
  openscript-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: name reference matches the pinned chartly-script
        run: node .claude/skills/openscript/generate-reference.mjs --check
      - name: every name is described, every planned name is marked, every shape is demonstrated
        run: node .claude/skills/openscript/coverage.mjs
      - name: every diagnostic code the pitfalls page names behaves as it says
        run: node .claude/skills/openscript/check-pitfalls.mjs

  # Frontend build (includes TypeScript check)
  # Matrixed across the LTS majors declared in frontend/package.json engines.
  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist-node${{ matrix.node-version }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  # Frontend unit tests
  frontend-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-report-node${{ matrix.node-version }}
          path: frontend/coverage/
          retention-days: 7

  # Frontend E2E tests (Chromium only for speed)
  # Pinned to 24.04: ubuntu-latest became 26.04, which Playwright supports only
  # from 1.64.0, and installing its browser fails on the 1.58 this project locks.
  frontend-e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project=chromium
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Serve the exact Node 22 build that commit-dist will publish.
  frontend-built-smoke:
    needs: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist-node22
          path: ${{ runner.temp }}/chartly-smoke-dist
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install the browser test runner
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise the built app through Flask
        env:
          CHARTLY_BUILT_SMOKE: '1'
          CHARTLY_E2E_BASE_URL: http://127.0.0.1:5181
        run: |
          .venv/bin/python -m scripts.built_app_smoke \
            --dist "$RUNNER_TEMP/chartly-smoke-dist" --work-dir "$RUNNER_TEMP" \
            > "$RUNNER_TEMP/chartly-smoke.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 1 "$CHARTLY_E2E_BASE_URL/_smoke/ready"; then
              break
            fi
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 1
          done
          curl --fail --silent --show-error --max-time 1 "$CHARTLY_E2E_BASE_URL/_smoke/ready"
          cd frontend
          npm run e2e -- --project=chromium --retries=0 built-app-smoke.spec.ts home.spec.ts
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: built-app-smoke-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/chartly-smoke.log
          retention-days: 7

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev
      - name: Bandit security scan
        run: uv run bandit -r . -x .venv,test,frontend,node_modules -ll -f txt
        continue-on-error: true
      - name: pip-audit vulnerability scan
        run: uv run pip-audit
        continue-on-error: true

  # Allow maintainers to opt into committing built frontend assets.
  commit-dist:
    runs-on: ubuntu-latest
    needs: [frontend-built-smoke, frontend-lint, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.CHARTLY_COMMIT_FRONTEND_DIST == 'true'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist-node22
          path: ${{ runner.temp }}/chartly-smoke-dist
      - name: Stage the verified frontend build
        run: |
          git rm -r -f --ignore-unmatch frontend/dist
          mkdir -p frontend/dist
          cp -a "$RUNNER_TEMP/chartly-smoke-dist/." frontend/dist/
      - name: Commit and push dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f is needed because frontend/dist/ is gitignored for contributors,
          # but the pre-compressed variants stay excluded: gzip/brotli output is
          # incompressible and undeltifiable, so committing it on every rebuild
          # grew to two thirds of the repository history and tripled clone
          # times. utils/precompress_assets.py regenerates them at app startup.
          git add -f frontend/dist/ ':(exclude)frontend/dist/*.gz' ':(exclude)frontend/dist/*.br'
          git diff --staged --quiet || git commit -m "chore: auto-build frontend dist [skip ci]"
          git push

  # Docker build, scan, and push to Docker Hub (main branch only).
  #
  # Multi-arch (issue #1205): builds linux/amd64 and linux/arm64 natively on
  # per-arch GitHub runners (ubuntu-latest / ubuntu-24.04-arm). No QEMU
  # emulation — each matrix leg runs on its own native arch. This is
  # essential because the image now installs chromium for Kaleido/Plotly
  # chart rendering, and chromium's apt post-install scripts are painfully
  # slow under QEMU (15-25 min vs ~2 min native).
  #
  # On PRs: each leg builds with `load: true` and runs the Kaleido smoke
  # test against the locally-loaded image of its own arch. No push. This
  # gives us native arm64 smoke-test coverage that a single-arch CI could
  # never provide.
  #
  # On main push: each leg builds and pushes by digest (no tag assigned),
  # then the docker-manifest job downloads all per-arch digests and
  # assembles them into a single Docker Hub manifest list under the
  # canonical tags (:latest, :<sha>).
  docker-build:
    needs: [backend-lint, backend-test, frontend-built-smoke, security-scan, gunicorn-boot, eventlet-fallback, gthread-gates, gthread-migration, gthread-platforms]
    # Publish on main only when this repository has configured Docker Hub.
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && vars.CHARTLY_PUBLISH_DOCKER == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Per-arch metadata — labels only. Final tags are assigned by the
      # docker-manifest merge job, not here.
      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/chartly

      # PR path: build single-arch and load into the runner's local Docker
      # daemon for the smoke test. No push.
      - name: Build (PR load)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: chartly-ci:${{ matrix.suffix }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      # Main-push path: build per-arch and push by digest. The manifest
      # job downstream assembles the per-arch digests into the final
      # multi-arch tags.
      - name: Build (main push by digest)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: build-main
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/chartly,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      # Kaleido + Chromium smoke test, run natively on each matrix leg.
      # Renders a trivial Plotly figure to PNG inside the just-built image
      # to verify chromium + kaleido + plotly are wired up end to end. Now
      # runs on both amd64 and arm64, so arch-specific regressions (e.g.
      # missing arm64 Chromium libs, wheel compatibility issues) surface
      # in CI rather than in production.
      - name: Kaleido + Chromium smoke test
        if: github.event_name == 'pull_request'
        run: |
          SUFFIX="${{ matrix.suffix }}"
          echo "[smoke] Testing chartly-ci:$SUFFIX"
          docker run --rm --entrypoint /app/.venv/bin/python "chartly-ci:$SUFFIX" -c '
          import plotly.graph_objects as go
          img = go.Figure(data=[go.Candlestick(
              x=[1, 2], open=[100, 102], high=[105, 106],
              low=[99, 101], close=[104, 103]
          )]).to_image(format="png", engine="kaleido")
          assert len(img) > 1000, f"unexpected PNG size: {len(img)}"
          print(f"Kaleido smoke test OK: {len(img)} bytes")
          '
          echo "[smoke] $SUFFIX OK"

      # Export the per-arch digest so the docker-manifest job can pick it
      # up and assemble the final manifest list.
      - name: Export digest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build-main.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-arch digests into a single Docker Hub manifest list
  # (linux/amd64 + linux/arm64) under the canonical tags (:latest, :<sha>).
  # Runs only on main push; Trivy scan against the assembled image also
  # happens here.
  docker-manifest:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.CHARTLY_PUBLISH_DOCKER == 'true'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/chartly
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=

      - name: Create multi-arch manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ secrets.DOCKERHUB_USERNAME }}/chartly@sha256:%s ' *)

      - name: Inspect assembled image
        run: |
          docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/chartly:${{ steps.meta.outputs.version }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/chartly:latest
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          format: 'table'
